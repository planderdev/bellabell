name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          npm ci
      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Unit and content tests
        run: php tests/run.php
      - name: JavaScript, design-system and motion checks
        run: |
          npm run check
          node tests/design-system.mjs
          node tests/motion.mjs
      - name: HTTP smoke test
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8080/healthz
          python tests/http_check.py
      - name: Contact form end-to-end (loopback SMTP)
        run: python tests/smtp_integration.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bellabell:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name bellabell -p 8080:80 -e APP_ENV=test -e APP_URL=http://127.0.0.1:8080 bellabell:ci
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null && break; sleep 0.3; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/ko/ | grep -q 200
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/data/ko.php | grep -q 403
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/.env | grep -q 403
          docker logs bellabell | tail -20
